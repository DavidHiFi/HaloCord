<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https://cdn.discordapp.com; style-src 'unsafe-inline'; script-src 'self'">
<title>HaloCord Overlay</title>
<style>
:root { --accent: #dbdee1; --accent-rgb: 219 222 225; --bg: rgb(14 15 17 / .86); --bg-solid: rgb(20 21 24 / .96); --line: rgb(255 255 255 / .08);
    --text: #eceef1; --muted: #a3a8b0; --danger: #f2555a; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none;
    font: 500 14px/1.25 "gg sans", "Segoe UI", system-ui, sans-serif; color: var(--text); }
#dim { position: fixed; inset: 0; background: rgb(0 0 0 / .5); opacity: 0; transition: opacity .2s; pointer-events: none; }
.unlocked #dim { opacity: 1; }
[hidden] { display: none !important; }

.widget { position: fixed; left: 16px; top: 16px; border-radius: 10px; border: 1px solid transparent; transition: opacity .15s; }
.unlocked .widget { cursor: move; border-color: rgb(var(--accent-rgb) / .55); background: var(--bg); box-shadow: 0 6px 20px rgb(0 0 0 / .35); }
.head { display: none; padding: 6px 10px 0; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.unlocked .head, #activity .head { display: block; }

#voice { min-width: 40px; padding: 4px; }
#voice ul { list-style: none; margin: 0; padding: 0; }
#voice li { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.av { position: relative; flex: none; width: 40px; height: 40px; }
.small .av { width: 24px; height: 24px; }
.av img { width: 100%; height: 100%; border-radius: 50%; display: block; background: #1d1f23; box-shadow: 0 0 0 1px var(--line); transition: box-shadow .1s; }
.speaking .av img { box-shadow: 0 0 0 2px var(--accent), 0 0 10px rgb(var(--accent-rgb) / .45); }
.name { padding: 3px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line);
    max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.speaking .name { border-color: rgb(var(--accent-rgb) / .5); }
.small .name { font-size: 12px; padding: 2px 6px; }
.icons { display: flex; gap: 2px; }
.icons svg { width: 16px; height: 16px; padding: 2px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); fill: var(--danger); }
.small .icons svg { width: 12px; height: 12px; }
#more { margin: 2px 0 0; padding: 2px 8px; width: fit-content; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
#empty { display: none; padding: 6px 8px; color: var(--muted); font-size: 13px; }
.unlocked #voice.none #empty { display: block; }

#quick { display: flex; gap: 4px; padding: 4px; left: 16px; top: 220px; background: var(--bg); border-color: var(--line); }
#quick .head { display: none; }
#quick button { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 8px;
    background: rgb(255 255 255 / .04); color: var(--text); cursor: pointer; }
#quick button:hover { border-color: rgb(var(--accent-rgb) / .6); background: rgb(var(--accent-rgb) / .12); }
#quick button.on { color: var(--danger); border-color: rgb(242 85 90 / .5); }
#quick button.end { color: var(--danger); }
#quick button.end:hover { border-color: rgb(242 85 90 / .6); background: rgb(242 85 90 / .14); }
#quick svg { width: 18px; height: 18px; fill: currentColor; }
.locked:not(.clickable) #quick button { pointer-events: none; }

#activity { width: 260px; left: 16px; top: 280px; background: var(--bg); border-color: var(--line); padding-bottom: 4px; }
#activity ul { list-style: none; margin: 4px 0 0; padding: 0 6px; }
#activity li { display: flex; align-items: center; gap: 8px; padding: 4px; border-radius: 6px; }
#activity li img { width: 28px; height: 28px; border-radius: 50%; background: #1d1f23; flex: none; }
#activity li b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#activity li span { display: block; font-size: 12px; font-weight: 400; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#activity li.same span { color: var(--accent); }
#activity li div { min-width: 0; }
#activity p { margin: 6px 10px 4px; font-size: 13px; color: var(--muted); }

#toasts { position: fixed; display: flex; flex-direction: column; gap: 8px; width: 340px; }
#toasts.topLeft { left: 16px; top: 16px; }
#toasts.topRight { right: 16px; top: 16px; }
#toasts.bottomLeft { left: 16px; bottom: 16px; flex-direction: column-reverse; }
#toasts.bottomRight { right: 16px; bottom: 16px; flex-direction: column-reverse; }
.toast { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg-solid); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); box-shadow: 0 6px 20px rgb(0 0 0 / .4); opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s; }
.toast.in { opacity: 1; transform: none; }
.toast.link { cursor: pointer; }
.toast.link:hover { border-color: rgb(var(--accent-rgb) / .6); }
.locked:not(.clickable) .toast { pointer-events: none; }
.toast img { flex: none; width: 36px; height: 36px; border-radius: 50%; background: #1d1f23; }
.toast b { display: block; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast span { margin-top: 2px; font-weight: 400; color: #d5d8dd; font-size: 13px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; word-break: break-word; }
.toast div { min-width: 0; }

#hint { position: fixed; left: 50%; top: 24px; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px;
    background: var(--bg-solid); border: 1px solid rgb(var(--accent-rgb) / .45); display: none; }
.unlocked #hint { display: block; }
kbd { font: inherit; padding: 1px 6px; border-radius: 4px; background: rgb(var(--accent-rgb) / .18); color: var(--accent); }
</style>
</head>
<body class="locked">
<div id="dim"></div>
<div id="voice" class="widget none" data-widget="voice"><div class="head" id="channel"></div><ul id="members"></ul><div id="more" hidden></div><div id="empty">Voice channel members show here</div></div>
<div id="quick" class="widget" data-widget="quick" hidden>
    <button id="q-mute" title="Mute"><svg><use href="#i-mic"/></svg></button>
    <button id="q-deaf" title="Deafen"><svg><use href="#i-head"/></svg></button>
    <button id="q-end" class="end" title="Disconnect"><svg><use href="#i-end"/></svg></button>
</div>
<div id="activity" class="widget" data-widget="activity" hidden><div class="head">Friends playing</div><ul id="friends"></ul><p id="nofriends">No friends are playing right now</p></div>
<div id="toasts" class="bottomRight"></div>
<div id="hint">Overlay unlocked: drag the widgets to move them. Press <kbd id="key"></kbd> to lock it.</div>

    <symbol id="i-deaf" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h1a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H5a7 7 0 0 1 11.6-5.27l1.42-1.42A8.97 8.97 0 0 0 12 3Zm7 7.24-2 2V19a2 2 0 0 0 2 2h-.24A3 3 0 0 0 21 18v-6c0-.62-.06-1.22-.18-1.8L19 12v-1.76ZM3.3 2.3a1 1 0 0 1 1.4 0l16 16a1 1 0 0 1-1.4 1.4l-16-16a1 1 0 0 1 0-1.4Z"/></symbol>

</svg>
<script src="hc-overlay.js"></script>
</body>
</html>
