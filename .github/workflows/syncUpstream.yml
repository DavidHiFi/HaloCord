name: Sync Equicord
on:
    workflow_dispatch:
    schedule:
        # Mondays. Equicord already merges Vencord, so this brings in both.
        - cron: 41 5 * * 1

permissions:
    actions: write
    contents: write
    pull-requests: write
    issues: write

jobs:
    Sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            # A clean merge goes to a pull request so the Test workflow checks it first.
            # A merge with conflicts opens an issue that lists the files to fix by hand.
            - name: Merge Equicord dev
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git remote add equicord https://github.com/Equicord/Equicord.git
                  git fetch --no-tags equicord dev
                  behind=$(git rev-list --count HEAD..equicord/dev)
                  if [[ "$behind" = "0" ]]; then echo "Up to date with Equicord"; exit 0; fi

                  branch="sync/equicord-$(date +%Y-%m-%d)"
                  git switch -c "$branch"
                  if git merge --no-edit equicord/dev -m "Merge Equicord dev ($behind commits)"; then
                      git push -u origin "$branch"
                      gh pr create --base main --head "$branch" --title "Merge Equicord dev ($behind commits)" \
                          --body "Weekly upstream sync. Merge after the Test check passes and a local build starts cleanly."
                      # Pull requests opened with the workflow token do not trigger other workflows, so start Test by hand.
                      gh workflow run test.yml --ref "$branch"
                      exit 0
                  fi

                  files=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
                  git merge --abort
                  title="Equicord sync needs a manual merge"
                  body=$(printf 'Equicord dev is %s commits ahead and the merge conflicts in:\n\n%s\n\nMerge locally: `git fetch https://github.com/Equicord/Equicord.git dev && git merge FETCH_HEAD`.' "$behind" "$files")
                  issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
                  if [[ -z "$issue" ]]; then
                      gh issue create --title "$title" --body "$body" --assignee "${{ github.repository_owner }}"
                  else
                      gh issue edit "$issue" --body "$body"
                  fi
