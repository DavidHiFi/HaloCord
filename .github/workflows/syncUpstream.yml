name: Sync upstream
on:
    workflow_dispatch:
    schedule:
        # Daily. Equicord already merges Vencord, so its sync brings in both.
        - cron: 41 5 * * *

permissions:
    actions: write
    contents: write
    pull-requests: write
    issues: write

jobs:
    Sync:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Equicord
                      url: https://github.com/Equicord/Equicord.git
                      branch: dev
                      base: .github/equicord-base
                    - name: TestCord
                      url: https://codeberg.org/Testcord/TestCord.git
                      branch: dev2
                      base: .github/testcord-base
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            # HaloCord keeps its own squashed history, so the merge runs against the last synced
            # upstream commit (the base file) and lands as one normal commit on top of main.
            # A clean merge goes to a pull request so the Test workflow checks it first.
            # A merge with conflicts opens an issue that lists the files to fix by hand.
            - name: Merge ${{ matrix.name }} ${{ matrix.branch }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  NAME: ${{ matrix.name }}
                  URL: ${{ matrix.url }}
                  BRANCH: ${{ matrix.branch }}
                  BASE_FILE: ${{ matrix.base }}
              run: |
                  git config user.name "DavidHiFi"
                  git config user.email "106938608+DavidHiFi@users.noreply.github.com"
                  git remote add upstream "$URL"
                  git fetch --no-tags upstream "$BRANCH"
                  base=$(cat "$BASE_FILE")
                  head=$(git rev-parse "upstream/$BRANCH")
                  if [[ "$base" = "$head" ]]; then echo "Up to date with $NAME"; exit 0; fi
                  behind=$(git rev-list --count "$base..$head")

                  if [[ -n "$(gh pr list --state open --search "in:title \"Sync $NAME\"" --json number --jq '.[0].number')" ]]; then
                      echo "A $NAME sync pull request is already open"; exit 0
                  fi

                  if out=$(git merge-tree --write-tree --name-only --no-messages --merge-base="$base" HEAD "$head"); then
                      branch="sync/${NAME,,}-$(date +%Y-%m-%d)"
                      git switch -c "$branch"
                      git reset -q --hard "$(git commit-tree "$(head -n1 <<<"$out")" -p HEAD -m "Sync $NAME $BRANCH ($behind commits)")"
                      echo "$head" > "$BASE_FILE"
                      git commit -qam "Record $NAME sync base"
                      git push -u origin "$branch"
                      gh pr create --base main --head "$branch" --title "Sync $NAME $BRANCH ($behind commits)" --body "Upstream sync. Merge after the Test check passes and a local build starts cleanly, then publish a release so the in-app updater delivers it."
                      # Pull requests opened with the workflow token do not trigger other workflows, so start Test by hand.
                      gh workflow run test.yml --ref "$branch"
                      exit 0
                  fi

                  files=$(tail -n +2 <<<"$out" | sed 's/^/- `/; s/$/`/')
                  title="$NAME sync needs a manual merge"
                  body=$(printf '%s %s is %s commits ahead and the merge conflicts in:\n\n%s\n\nMerge locally: `git fetch %s %s && git replace --graft HEAD $(cat %s) && git merge --squash FETCH_HEAD`, fix the conflicts, run `git replace -d HEAD`, write the FETCH_HEAD hash to %s, then commit.' "$NAME" "$BRANCH" "$behind" "$files" "$URL" "$BRANCH" "$BASE_FILE" "$BASE_FILE")
                  issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
                  if [[ -z "$issue" ]]; then
                      gh issue create --title "$title" --body "$body" --assignee "${{ github.repository_owner }}"
                  else
                      gh issue edit "$issue" --body "$body"
                  fi
